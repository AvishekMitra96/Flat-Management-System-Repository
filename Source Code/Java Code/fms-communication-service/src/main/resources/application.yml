server:
  port: 8085

spring:
  application:
    name: fms-communication-service
  datasource:
    url: jdbc:postgresql://localhost:5432/fms_db
    username: fms_user
    password: fms_password
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: fms-group
      auto-offset-reset: earliest

eureka:
  client:
    serviceUrl:
      defaultZone: http://localhost:8761/eureka/
